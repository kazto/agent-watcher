[package]
name = "agent-watcher"
version = "0.1.0"
edition = "2021"
description = "Resident WebSocket watcher for agent-gateway sessions: detects idle (waiting for input) and exited sessions and appends events to a JSONL file"
license = "MIT"
repository = "https://github.com/kazto/agent-watcher"
keywords = ["agent-gateway", "websocket", "watcher"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
url = "2"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
strip = true
